include current-theme.conf
background #000000
background_opacity 0.90

symbol_map U+F0001-U+F0001 PromptIcons

copy_on_select yes

# Ctrl+C copia si hay texto seleccionado y si no interrumpe el comando.
# Ctrl+V no se mapea aquí: fish ya pega con él, y si kitty lo intercepta las
# apps que lo leen ellas mismas (pegar imágenes en Claude Code) dejan de
# recibirlo. Ctrl+Shift+C/V siguen funcionando.
map ctrl+c copy_or_interrupt
