include current-theme.conf
background #000000
background_opacity 0.40

symbol_map U+F0001-U+F0001 PromptIcons

copy_on_select yes

# Copiar y pegar como en el resto de apps: Ctrl+V pega, Ctrl+C copia si hay
# texto seleccionado y si no interrumpe el comando. Ctrl+Shift+C/V siguen.
map ctrl+v paste_from_clipboard
map ctrl+c copy_or_interrupt
