# Ecualizador de 6 bandas (pestaña "Sonido" del dashboard, ver
# flipfrog/scripts/audio/eq_*.py) -- basado en la plantilla de fábrica de
# PipeWire (/usr/share/pipewire/filter-chain/sink-eq6.conf, filtros
# `builtin` bq_lowshelf/bq_peaking/bq_highshelf, sin plugins externos).
#
# Cargado por el proceso aparte `filter-chain.service` (systemd --user,
# `pipewire -c filter-chain.conf`, BindsTo=pipewire.service) -- NO es
# parte del pipewire.service principal, así que habilitarlo no reinicia
# ni corta el audio que ya está sonando.
#
# playback.props NO tiene target fijo a propósito: eq_router.py
# (daemon, autostart) conecta "effect_output.eq6" al sink de hardware
# que esté activo en cada momento (Bluetooth/parlantes/auriculares) vía
# pw-link, y lo re-conecta solo si el usuario cambia de salida
# (sink-selector.py) o el default cambia por cualquier otro motivo --
# ver eq_router.py para el mecanismo real.
context.modules = [
    { name = libpipewire-module-filter-chain
        args = {
            node.description = "Equalizer Sink"
            media.name       = "Equalizer Sink"
            filter.graph = {
                nodes = [
                    {
                        type  = builtin
                        name  = eq_band_1
                        label = bq_lowshelf
                        control = { "Freq" = 100.0 "Q" = 1.0 "Gain" = 0.0 }
                    }
                    {
                        type  = builtin
                        name  = eq_band_2
                        label = bq_peaking
                        control = { "Freq" = 100.0 "Q" = 1.0 "Gain" = 0.0 }
                    }
                    {
                        type  = builtin
                        name  = eq_band_3
                        label = bq_peaking
                        control = { "Freq" = 500.0 "Q" = 1.0 "Gain" = 0.0 }
                    }
                    {
                        type  = builtin
                        name  = eq_band_4
                        label = bq_peaking
                        control = { "Freq" = 2000.0 "Q" = 1.0 "Gain" = 0.0 }
                    }
                    {
                        type  = builtin
                        name  = eq_band_5
                        label = bq_peaking
                        control = { "Freq" = 5000.0 "Q" = 1.0 "Gain" = 0.0 }
                    }
                    {
                        type  = builtin
                        name  = eq_band_6
                        label = bq_highshelf
                        control = { "Freq" = 5000.0 "Q" = 1.0 "Gain" = 0.0 }
                    }
                ]
                links = [
                    { output = "eq_band_1:Out" input = "eq_band_2:In" }
                    { output = "eq_band_2:Out" input = "eq_band_3:In" }
                    { output = "eq_band_3:Out" input = "eq_band_4:In" }
                    { output = "eq_band_4:Out" input = "eq_band_5:In" }
                    { output = "eq_band_5:Out" input = "eq_band_6:In" }
                ]
            }
            audio.channels = 2
            audio.position = [ FL FR ]
            capture.props = {
                node.name   = "effect_input.eq6"
                media.class = Audio/Sink
            }
            playback.props = {
                node.name   = "effect_output.eq6"
                node.passive = true
            }
        }
    }
]
